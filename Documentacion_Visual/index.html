<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurante Paccioli · Presentación 3D</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <canvas id="scene"></canvas>

  <!-- ===== HUD superior ===== -->
  <header class="hud top">
    <div class="brand">
      <span class="logo"><i class="bi bi-cup-hot-fill"></i></span>
      <div>
        <h1>Restaurante Paccioli</h1>
        <p>Arquitectura del sistema · Presentación 3D</p>
      </div>
    </div>
    <div class="hud-actions">
      <span class="live-dot"><span class="pulse"></span> Windows Server 2022</span>
    </div>
  </header>

  <!-- ===== Toolbar de presentación ===== -->
  <div class="tourbar bottom">
    <div class="tour-nav">
      <button id="btn-prev" class="round-btn" title="Anterior (←)"><i class="bi bi-chevron-left"></i></button>
      <div class="tour-info">
        <span id="tour-index" class="tour-index">1 / 10</span>
        <span id="tour-name" class="tour-name">Servidor Windows Server 2022</span>
        <span id="tour-sub" class="tour-sub"></span>
      </div>
      <button id="btn-next" class="round-btn" title="Siguiente (→ / Espacio)"><i class="bi bi-chevron-right"></i></button>
    </div>
    <div class="tour-toolbar">
      <button id="btn-cables" class="tool-btn"><i class="bi bi-shuffle"></i> Cables</button>
      <button id="btn-auto" class="tool-btn"><i class="bi bi-play-fill"></i> Auto</button>
      <button id="btn-orbitar" class="tool-btn"><i class="bi bi-arrows-angle-expand"></i> Orbitar</button>
      <span class="speed-label">Velocidad</span>
      <button class="speed-btn active" data-speed="1">1×</button>
      <button class="speed-btn" data-speed="1.5">1.5×</button>
      <button class="speed-btn" data-speed="2">2×</button>
    </div>
  </div>

  <!-- ===== Ficha del sistema ===== -->
  <aside id="node-ficha" class="ficha">
    <h2 id="ficha-titulo"></h2>
    <div id="ficha-cuerpo"></div>
  </aside>

  <!-- ===== Progreso del tour ===== -->
  <div class="progress-row">
    <div class="progress-track"><div id="progress-bar-inner" class="progress-bar"></div></div>
  </div>

  <!-- ===== Leyenda / acceso rápido ===== -->
  <div id="leyenda-mini" class="leyenda-mini"></div>

  <!-- ===== Pista de teclas ===== -->
  <div class="keyhint">← → Espacio = siguiente · clic en figura = saltar · arrastrar = rotar</div>

  <script src="vendor/three.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
